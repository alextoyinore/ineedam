<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-title" content="Ineedam" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="description"
    content="Connecting real needs with real solutions. Ineedam is the community platform to ask for what you need and find people who can help." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ineedam.com/" />
  <meta property="og:title" content="Ineedam - Connect Needs with Solutions" />
  <meta property="og:description"
    content="A community-driven platform to share your needs and get discovered by those who can help. Built for clarity, speed, and trust." />
  <meta property="og:image" content="https://ineedam.com/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://ineedam.com/" />
  <meta property="twitter:title" content="Ineedam - Connect Needs with Solutions" />
  <meta property="twitter:description"
    content="A community-driven platform to share your needs and get discovered by those who can help. Built for clarity, speed, and trust." />
  <meta property="twitter:image" content="https://ineedam.com/og-image.png" />

  <title>Ineedam - Connect Needs with Solutions</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('app-theme') || 'system';
        var root = document.documentElement;
        var dark = false;
        if (theme === 'system') {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          dark = theme === 'dark';
        }
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        var metaTheme = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', dark ? '#000000' : '#ffffff');
      } catch (e) { }
    })();
  </script>
  <style>
    /* Critical CSS to prevent FOUC */
    html[data-theme='dark'] {
      background-color: #0f1115;
      color: #f8fafc;
    }

    html[data-theme='light'] {
      background-color: #ffffff;
      color: #0f172a;
    }

    body {
      background-color: inherit;
      color: inherit;
      margin: 0;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
